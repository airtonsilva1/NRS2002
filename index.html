<title>Acesso restrito</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef3f5;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#1b2733}
.card{background:#fff;width:100%;max-width:360px;margin:16px;padding:28px 24px;border-radius:10px;box-shadow:0 8px 30px rgba(16,32,48,.15);border:1px solid #d6e0e5}
h1{font-size:18px;margin:0 0 4px;color:#0b5a70}p{font-size:13px;color:#5b6b78;margin:0 0 18px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 4px;color:#0b5a70}
input[type=text],input[type=password]{width:100%;padding:11px;font-size:16px;border:1px solid #b9c8d0;border-radius:6px}
button{width:100%;margin-top:18px;padding:12px;font-size:15px;font-weight:700;color:#fff;background:#0f7490;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.rem{display:flex;gap:7px;align-items:center;font-size:12.5px;margin-top:12px;font-weight:400;color:#1b2733}
.rem input{width:auto}#msg{color:#b3261e;font-size:13px;min-height:18px;margin-top:10px;font-weight:600}
</style></head><body>
<form class="card" id="f" autocomplete="on">

<label for="p">Senha</label><input type="password" id="p" name="password" autocomplete="current-password" required>
<label class="rem"><input type="checkbox" id="r"> Lembrar neste aparelho</label>
<button id="b" type="submit">Entrar</button><div id="msg"></div>
</form>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(login,senha){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(login.trim().toLowerCase()+':'+senha),'PBKDF2',false,['deriveKey']);
  const ku=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:d64(D.salt),iterations:D.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let kraw=null;
  for(const e of D.users){
    try{ kraw=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(e.iv)},ku,d64(e.k)); break; }catch(_){}
  }
  if(!kraw) return false;
  const K=await crypto.subtle.importKey('raw',kraw,'AES-GCM',false,['decrypt']);
  const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(D.iv)},K,d64(D.ct));
  document.open(); document.write(new TextDecoder().decode(html)); document.close();
  return true;
}
const msg=document.getElementById('msg'),btn=document.getElementById('b');
async function tentar(login,senha,lembrar){
  btn.disabled=true; msg.textContent='';
  try{
    const ok=await abrir(login,senha);
    if(!ok){ msg.textContent='Login ou senha incorretos.'; btn.disabled=false; try{localStorage.removeItem('acesso_nutri')}catch(_){} return; }
    if(lembrar){ try{localStorage.setItem('acesso_nutri',JSON.stringify([login,senha]))}catch(_){} }
  }catch(err){ msg.textContent='Não foi possível abrir (navegador sem suporte a criptografia ou endereço não seguro).'; btn.disabled=false; }
}
document.getElementById('f').addEventListener('submit',ev=>{ ev.preventDefault();
  tentar(document.getElementById('u').value,document.getElementById('p').value,document.getElementById('r').checked); });
